name: recipes-backend

services:
  - name: api
    environment_slug: node-js
    github:
      repo: your-org/your-repo
      branch: main
      deploy_on_push: true
    run_command: 'npx prisma migrate deploy && node dist/main.api.js'
    build_command: 'npm ci --legacy-peer-deps && npx prisma generate && npm run build'
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        value: ${cache.REDIS_URL}
      - key: REDIS_HOST
        value: ${cache.HOST}
      - key: REDIS_PORT
        value: ${cache.PORT}
      - key: S3_ENDPOINT
        value: ${space.ENDPOINT}
      - key: S3_BUCKET
        value: ${space.BUCKET}
      - key: S3_ACCESS_KEY_ID
        value: ${space.ACCESS_KEY}
      - key: S3_SECRET_ACCESS_KEY
        value: ${space.SECRET_KEY}
      - key: S3_REGION
        value: 'nyc3'
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        scope: RUN_TIME
        type: SECRET
      - key: APPLE_CLIENT_ID
        value: ${APPLE_CLIENT_ID}
        scope: RUN_TIME
      - key: APPLE_TEAM_ID
        value: ${APPLE_TEAM_ID}
        scope: RUN_TIME
      - key: APPLE_KEY_ID
        value: ${APPLE_KEY_ID}
        scope: RUN_TIME
      - key: APPLE_PRIVATE_KEY
        value: ${APPLE_PRIVATE_KEY}
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        value: ${SENTRY_DSN}
        scope: RUN_TIME
      - key: ENABLE_DEMO
        value: 'true'
      - key: CORS_ORIGINS
        value: 'https://demo.example.com'
      - key: USE_REDIS_PUBSUB
        value: 'true'

  - name: worker
    environment_slug: node-js
    github:
      repo: your-org/your-repo
      branch: main
      deploy_on_push: true
    run_command: 'node dist/main.worker.js'
    build_command: 'npm ci --legacy-peer-deps && npx prisma generate && npm run build'
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        value: ${cache.REDIS_URL}
      - key: REDIS_HOST
        value: ${cache.HOST}
      - key: REDIS_PORT
        value: ${cache.PORT}
      - key: S3_ENDPOINT
        value: ${space.ENDPOINT}
      - key: S3_BUCKET
        value: ${space.BUCKET}
      - key: S3_ACCESS_KEY_ID
        value: ${space.ACCESS_KEY}
      - key: S3_SECRET_ACCESS_KEY
        value: ${space.SECRET_KEY}
      - key: S3_REGION
        value: 'nyc3'
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        value: ${SENTRY_DSN}
        scope: RUN_TIME

databases:
  - name: db
    engine: PG
    version: '16'

caches:
  - name: cache
    engine: valkey

spaces:
  - name: space
