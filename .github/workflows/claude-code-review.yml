name: Claude Code Review

permissions: {}

on:
  workflow_run:
    workflows: ["Tests and Build", "Lint Check", "CodeQL"]
    types: [completed]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  gate:
    name: Wait for all upstream workflows to succeed
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}

    steps:
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Check statuses for this commit (by workflow name)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # List the upstream WORKFLOW NAMES you require
          required_workflows=("Tests and Build" "Lint Check" "CodeQL")

          # Fetch all workflows (to map name -> id)
          workflows_json=$(gh api repos/$REPO/actions/workflows)

          all_ok=true
          for wf_name in "${required_workflows[@]}"; do
            # Find workflow ID by name
            wf_id=$(echo "$workflows_json" | jq -r --arg n "$wf_name" \
              '.workflows[] | select(.name == $n) | .id' | head -n1)

            if [[ -z "$wf_id" || "$wf_id" == "null" ]]; then
              echo "Could not find a workflow named '$wf_name' in this repo."
              all_ok=false
              break
            fi

            # Get latest run of that workflow for THIS commit
            run_json=$(gh api repos/$REPO/actions/workflows/$wf_id/runs \
              -F head_sha="$SHA" -F per_page=1)

            conclusion=$(echo "$run_json" | jq -r '.workflow_runs[0].conclusion // ""')
            status=$(echo "$run_json" | jq -r '.workflow_runs[0].status // ""')

            # If there's no run yet, or it isn’t completed/success → not ready
            if [[ -z "$conclusion" || "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "Workflow '$wf_name' not successful yet (status=$status, conclusion=$conclusion)."
              all_ok=false
              break
            fi
          done

          echo "ready=$all_ok" >> "$GITHUB_OUTPUT"
  claude-review:
    needs: gate
    if: ${{ needs.gate.outputs.ready == 'true' }}

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--model haiku --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
