version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tasteloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasteloop
      POSTGRES_PASSWORD: tasteloop_dev_password
      POSTGRES_DB: tasteloop
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasteloop']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tasteloop-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://tasteloop:tasteloop_dev_password@postgres:5432/tasteloop
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npm run start:dev"

volumes:
  postgres_data:
