services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: tasteloop-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasteloop-network

  postgres:
    image: postgres:17-alpine
    container_name: tasteloop-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasteloop -d tasteloop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasteloop-network

  object-storage:
    image: minio/minio:latest
    container_name: tasteloop-object-storage
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${SPACES_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasteloop-network

  object-storage-setup:
    image: minio/mc:latest
    container_name: tasteloop-object-storage-setup
    depends_on:
      object-storage:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
        mc config host add local http://object-storage:9000 ${SPACES_ACCESS_KEY_ID} ${SPACES_SECRET_ACCESS_KEY};
        mc mb --ignore-existing local/${SPACES_BUCKET};
        mc anonymous set download local/${SPACES_BUCKET};
        exit 0;
      "
    networks:
      - tasteloop-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasteloop-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${PORT}
      SPACES_ENDPOINT: http://object-storage:9000
      SPACES_FORCE_PATH_STYLE: "true"
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      object-storage:
        condition: service_started
      object-storage-setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run prisma:generate && npm run prisma:migrate:prod && npm run start:dev"
    networks:
      - tasteloop-network
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasteloop-queue
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: >-
      sh -c "npm ci && npm run prisma:generate && npm run start:queue:dev"
    networks:
      - tasteloop-network
    restart: unless-stopped

volumes:
  postgres_data:
  object_storage_data:

networks:
  tasteloop-network:
    driver: bridge
